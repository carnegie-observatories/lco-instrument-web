<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>guider — live</title>
<!-- The package's own sheet first (overlay/plots emit class names and no colours), then ours. -->
<link rel="stylesheet" href="../../pkg/core/src/overlay/overlay.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body data-kind="guider">

<!-- One of the two pages of viewer/ — app.js reads data-kind on <body> and mounts the matching
     panel. Everything else on screen comes from `mountViewerChrome` (app.js), inserted *before*
     this markup. These two are ours: the stream strip along the top and the panel. -->
<header id="strip">
  <b id="strip-title">guider</b>
  <span id="strip-state" class="dim">connecting…</span>
  <label>tier
    <select id="tier">
      <option value="lossless">lossless</option>
      <option value="bin2" selected>bin 2 · q 0.5</option>
      <option value="bin4">bin 4 · q 0.5</option>
    </select>
  </label>
  <label>workers
    <select id="workers">
      <option value="0">inline</option>
      <option value="2">2</option>
      <option value="4" selected>4</option>
    </select>
  </label>
  <!-- Shared by every viewer of this guider (they act at gcamweb's source), hence the label.
       Disabled until gcamweb answers the setters (zwo PR #35); app.js probes. -->
  <label title="only the central part of the frame is sent — for everyone watching this guider">image
    <select id="roi">
      <option value="1">full</option>
      <option value="2">centre ½</option>
      <option value="4">centre ¼</option>
      <option value="8">centre ⅛</option>
    </select>
  </label>
  <label title="frame stride — for everyone watching this guider">frames
    <select id="every">
      <option value="1">all</option>
      <option value="2">every 2nd</option>
      <option value="4">every 4th</option>
      <option value="8">every 8th</option>
    </select>
  </label>
  <span class="dim" title="image and frames are gcamweb settings shared by all viewers of this guider">shared</span>
  <span id="strip-rate" class="dim"></span>
  <span class="grow"></span>
  <button id="panel-toggle" type="button" title="the guider panel (k)">guider</button>
  <button id="help-toggle" type="button" title="every binding (?)">?</button>
  <a href="../" class="dim" title="the other guiders this server serves">guiders</a>
</header>

<section id="panel"></section>

<!-- Import map: the server mounts the astro-ph monorepo's packages ONCE at /pkg/, two levels
     above this page (/image/<app>/ or /guider/<name>/), so the addresses are relative — the page
     never knows its prefix, only its depth. chz1 ships plain JS (ts/src); core and viewer resolve
     to their built dist/. The decode worker and the wasm are NOT resolved through this map
     (workers ignore import maps); app.js builds their URLs the same way. -->
<script type="importmap">
{
  "imports": {
    "@astro-ph-labs/chz1": "../../pkg/chz1/ts/src/index.js",
    "@astro-ph-labs/chz1/": "../../pkg/chz1/ts/src/",
    "@astro-ph-labs/core": "../../pkg/core/dist/index.js",
    "@astro-ph-labs/core/": "../../pkg/core/dist/",
    "@astro-ph-labs/viewer": "../../pkg/viewer/dist/index.js",
    "@astro-ph-labs/viewer/": "../../pkg/viewer/dist/"
  }
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
