# ADC outlet bindings — phase 6 (writes + reads). Topics + paths follow the
# Step 0 audit's snapshot shapes:
#
#   status    → { adc, control, other, update, running }
#   lens      → { lens_a:{encoder,target,moving}, lens_b:{...} }
#   telescope → { elevation, rotator }

ignore_outlets:
  - view_eng              # eng-mode indicator; composes 3 flags — defer to phase 7

outlets:
  popup_adc:
    options:
      Retracted: out
      Inserted:  in
    read:
      topic: status
      path:  adc
    write:
      cmd: set_adc_insertion
      args: { pos: $state }
      # Short slide moves can complete inside the 1 Hz state coalesce, so
      # the spinner would briefly flash 1s late. Show it on cmd-send;
      # the existing read on `status.adc` clears it on the next push.
      optimistic_spinner: prog_adc

  popup_other:
    options:
      Retracted: out
      Inserted:  in
    read:
      topic: status
      path:  other
    write:
      cmd: set_other_insertion
      args: { pos: $state }
      optimistic_spinner: prog_other

  popup_control:
    options:
      "Off":  "off"
      Auto:   auto
    read:
      topic: status
      path:  control
    write:
      cmd: set_control_mode
      args: { mode: $state }

  chk_update:
    read:
      topic: status
      path:  update
    write:
      cmd: set_auto_update
      args: { enabled: $state }

  but_update:
    write:
      cmd: trigger_manual_update

  but_run:
    read:
      topic: status
      path:  running
      # The Cocoa AppDelegate's updateRunMode flips between "Run" and
      # "Park"; mirror that here so the web button reads the same.
      label_map: { "true": Park, "false": Run }
    write:
      cmd: set_running
      args: { running: $not_state }

  # Lens encoders — editable input + readback. Focus guard in the renderer
  # protects the user's in-progress typing from being clobbered.
  edit_encA:
    read:  { topic: lens, path: "lens_a.encoder", format: "%.2f" }
    write: { cmd: move_lens, args: { lens: A, angle: $value }, optimistic_spinner: prog_lensA }
  edit_encB:
    read:  { topic: lens, path: "lens_b.encoder", format: "%.2f" }
    write: { cmd: move_lens, args: { lens: B, angle: $value }, optimistic_spinner: prog_lensB }

  edit_targetA:
    read:  { topic: lens, path: "lens_a.target", format: "%.2f" }
  edit_targetB:
    read:  { topic: lens, path: "lens_b.target", format: "%.2f" }

  edit_elevation:
    read:  { topic: telescope, path: elevation, format: "%.2f" }
  edit_rotator:
    read:  { topic: telescope, path: rotator,   format: "%.2f" }

  # Spinners — only visible when the corresponding axis reports moving.
  prog_adc:
    read:
      topic: status
      path:  adc
      class_map: { moving: is-moving }
  prog_other:
    read:
      topic: status
      path:  other
      class_map: { moving: is-moving }
  prog_lensA:
    read:
      topic: lens
      path:  "lens_a.moving"
      class_map: { "true": is-moving }
  prog_lensB:
    read:
      topic: lens
      path:  "lens_b.moving"
      class_map: { "true": is-moving }

  # Color wells — Cocoa flips them green/grey based on the slide's state.
  col_adcIn:
    read:
      topic: status
      path:  adc
      class_map: { in: is-on, moving: is-warn }
  col_adcOut:
    read:
      topic: status
      path:  adc
      class_map: { out: is-on, moving: is-warn }
  col_otherIn:
    read:
      topic: status
      path:  other
      class_map: { in: is-on, moving: is-warn }
  col_otherOut:
    read:
      topic: status
      path:  other
      class_map: { out: is-on, moving: is-warn }
