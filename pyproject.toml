[project]
name = "lco-instrument-web"
version = "0.1.0"
description = "Python tooling for the LCO instrument web SPA (static server, xib2ir, Access policy sync)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "xib2ir",
    "jsonschema>=4.26.0",
    "aiohttp>=3.14.3",
]

# Quick look is optional because it cannot be installed everywhere:
# imageweb depends on chz1, which is unpublished and consumed as a path
# dependency into a private astro-ph checkout two levels above this repo.
# A gateway on a machine without that checkout must still install and
# serve the SPA, the instrument WebSockets and the guiders -- it simply
# has no /image/<app>/. Install it where the monorepo exists:
#
#     uv sync --extra quicklook
[project.optional-dependencies]
quicklook = ["imageweb"]

[tool.uv.sources]
xib2ir = { workspace = true }
imageweb = { workspace = true }

[tool.uv.workspace]
members = ["tools/xib2ir", "imageweb"]
