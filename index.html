<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LCO Instrument</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <a href="landing.html" class="brand-back muted" title="Back to instrument chooser">←</a>
      <strong id="app-name">—</strong>
      <span class="muted" id="app-version"></span>
    </div>
    <div class="view-toggle">
      <button data-view="window">Window</button>
      <button data-view="diagnostic">Diagnostic</button>
    </div>
    <div class="ui-scale" title="UI scale (Window view)">
      <span class="muted">scale</span>
      <input id="ui-scale" type="range" min="1" max="3" step="0.1" value="1.5">
      <span class="muted" id="ui-scale-readout">1.5×</span>
    </div>
    <div class="conn">
      <span id="conn-dot" class="dot"></span>
      <span id="conn-state">connecting…</span>
      <span class="muted" id="conn-url"></span>
    </div>
  </header>

  <div id="window-view">
    <div class="placeholder">
      <p>Main window view — not yet built.</p>
      <p class="hint muted">The position-faithful main expose window will land here in a later phase. Use the Diagnostic view in the meantime.</p>
    </div>
  </div>

  <div id="diagnostic-view">
    <main>
      <section id="topics-pane">
        <h2>Topics</h2>
        <div id="topics"></div>
      </section>

      <section id="commands-pane">
        <h2>Commands</h2>
        <div id="commands"></div>
      </section>
    </main>
  </div>

  <!-- Log pane lives outside the view wrappers so it stays visible in
       both Window and Diagnostic views — useful for protocol debugging
       while operating the instrument. -->
  <section id="log-pane">
    <div class="log-head">
      <h2>Log</h2>
      <div class="log-controls">
        <label class="muted" for="log-level">level</label>
        <select id="log-level">
          <option value="debug">debug+</option>
          <option value="info" selected>info+</option>
          <option value="warn">warn+</option>
          <option value="error">error</option>
        </select>
        <button id="log-clear">clear</button>
      </div>
    </div>
    <ol id="log"></ol>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
