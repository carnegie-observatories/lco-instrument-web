# Cloudflare Access policy -- who may control each telescope.
#
# Synced to Cloudflare by deploy/sync-access-policies.py.
# Entries for sbs are generated from
# deployments/<name>.yml by tools/generate_deploy_artifacts.py -- edit the
# deployment file for those. The rest are still hand-written here.
#
# Allowed-entry forms:
#   "*@carnegiescience.edu"   whole-domain wildcard -> Access "Emails
#                             ending in" rule. The ONLY wildcard form
#                             Cloudflare Access supports.
#   "operator@example.org"    exact address -> Access "Email" rule.
#
# Entries are additive (logical OR). An empty list locks the telescope
# down to nobody -- the sync script refuses to push an empty policy
# unless --allow-lockout is given.

account_id: 2a906eabd142753a2aec93f19f2f9f6a
session_duration: 24h
telescopes:
  clay:
    domain: clay.chimera.observer
    allowed:
    - '*@carnegiescience.edu'
  baade:
    domain: baade.chimera.observer
    allowed:
    - '*@carnegiescience.edu'
  swope:
    domain: swope.chimera.observer
    allowed:
    - '*@carnegiescience.edu'
  sbs:
    domain: sbs.chimera.observer
    allowed:
    - '*@carnegiescience.edu'
    - hreggiani@gmail.com
    - ph.silva@gmail.com
